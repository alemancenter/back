name: Verify Phase 3 Inventory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test content quality
        run: go test ./internal/contentquality
      - name: Test content audit service
        run: go test ./internal/services/contentaudit
      - name: Test content audit handlers
        run: go test ./internal/handlers/contentaudit
      - name: Compile repositories
        run: go test ./internal/repositories
      - name: Test core services including sitemap
        run: go test ./internal/services
      - name: Compile routes
        run: go test ./internal/routes
      - name: Compile server
        run: go test ./cmd/server
