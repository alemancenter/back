name: Verify 2G Corruption Controls

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test deterministic corruption detector
        run: go test ./internal/contentquality
      - name: Test content audit quality gate and admin handlers
        run: go test ./internal/services/contentaudit ./internal/handlers/contentaudit
      - name: Compile repository changes
        run: go test ./internal/repositories
      - name: Test sitemap integration
        run: go test ./internal/services -run 'Test(SitemapQualityIndexable|QualityDecisionForSitemap|ArticleWritesScheduleSitemapRefresh|PostWritesScheduleSitemapRefresh)$'
      - name: Compile route wiring
        run: go test ./internal/routes
