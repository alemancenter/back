# =============================================================================
# Nginx Configuration — imanjo.com
# =============================================================================
# Frontend  : Astro (Node standalone adapter) on 127.0.0.1:8080
# Backend   : Go Fiber on 127.0.0.1:8082
#
# Drafted from back/nginx.conf during the alemancenter.com → imanjo.com migration.
# UNCONFIRMED WHICH CONVENTION IS REAL: this session's audit found that the live server
# sends an `X-Powered-By: PleskLin` header, meaning Plesk is the actual hosting panel —
# Plesk typically manages the main server block itself and takes extra location rules via
# its own "Additional Nginx Directives" UI field, NOT a manually-managed sites-available
# file like this one. The same audit also caught back/nginx.conf's tracked /storage/
# location drifting from what's actually live. Treat this file as a reference/fallback for
# a non-Plesk (plain nginx) deployment, and prefer nginx-api-additional-directives.conf +
# nginx-frontend-additional-directives.conf in this same directory if Plesk is confirmed.
#
# The single biggest change from the old file: the entire Next.js "Frontend" server block
# (upstream frontend on :3000, /_next/static/ caching, ISR proxy_cache keyed on Next.js's
# own Cache-Control convention) is GONE. Astro's Node adapter serves its own build output
# directly and does its own response caching in-process (see Astro/astro.config.mjs's
# routeRules + memoryCache()) — there's no ISR-equivalent nginx needs to understand
# anymore, so this doesn't need replacing 1:1, just proxying.
#
# Deploy (non-Plesk path):
#   mkdir -p /var/cache/nginx/imanjo && chown www-data:www-data /var/cache/nginx/imanjo
#   cp nginx.conf /etc/nginx/sites-available/imanjo.com
#   ln -sf /etc/nginx/sites-available/imanjo.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# =============================================================================

# ── Upstream servers ─────────────────────────────────────────────────────────
upstream frontend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream backend {
    server 127.0.0.1:8082;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name imanjo.com www.imanjo.com api.imanjo.com;
    return 301 https://$host$request_uri;
}

# =============================================================================
# Frontend — imanjo.com
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name imanjo.com www.imanjo.com;

    # ── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/imanjo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imanjo.com/privkey.pem;
    ssl_protocols            TLSv1.2 TLSv1.3;
    ssl_ciphers              ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache        shared:SSL:10m;
    ssl_session_timeout      10m;
    ssl_session_tickets      off;
    ssl_stapling             on;
    ssl_stapling_verify      on;
    resolver                 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout         5s;
    server_tokens            off;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;

    # ── Astro's hashed, immutable build assets — long cache ──────────────────
    location /_astro/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── All other frontend requests ──────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}

# =============================================================================
# Backend API — api.imanjo.com
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.imanjo.com;

    # ── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.imanjo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.imanjo.com/privkey.pem;
    ssl_protocols            TLSv1.2 TLSv1.3;
    ssl_ciphers              ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache        shared:SSL:10m;
    ssl_session_timeout      10m;
    ssl_session_tickets      off;
    ssl_stapling             on;
    ssl_stapling_verify      on;
    resolver                 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout         5s;
    server_tokens            off;

    # ── Security ─────────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;

    # ── CORS safety net — added on ALL responses including 4xx/5xx ──────────
    # These duplicate what Go Fiber adds, but ensure CORS headers are present
    # even when Nginx itself returns an error (502, 504, etc.) before the
    # request reaches Go Fiber.
    #
    # NOTE: only checks the bare apex here, same as the file this was drafted from — decide
    # whether www.imanjo.com needs the same allowance, or whether www is meant to redirect
    # to the apex before it ever reaches this check (confirm actual DNS/redirect setup).
    set $cors_origin "";
    if ($http_origin = "https://imanjo.com") {
        set $cors_origin "https://imanjo.com";
    }
    add_header Access-Control-Allow-Origin      $cors_origin   always;
    add_header Access-Control-Allow-Credentials "true"         always;
    add_header Access-Control-Allow-Methods     "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Origin,Content-Type,Accept,Authorization,X-Requested-With,X-Frontend-Key,X-Country-Id,X-Country-Code,X-App-Locale,X-CSRF-Token,Cache-Control" always;

    # ── OPTIONS preflight — handled by Nginx directly (no backend hit) ───────
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials "true"       always;
            add_header Access-Control-Allow-Methods     "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Origin,Content-Type,Accept,Authorization,X-Requested-With,X-Frontend-Key,X-Country-Id,X-Country-Code,X-App-Locale,X-CSRF-Token,Cache-Control" always;
            add_header Access-Control-Max-Age           86400        always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering    off;
    }

    # ── AI generation — model inference can take up to 90s ──────────────────
    location ~ ^/api/ai/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials "true"       always;
            add_header Access-Control-Allow-Methods     "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Origin,Content-Type,Accept,Authorization,X-Requested-With,X-Frontend-Key,X-Country-Id,X-Country-Code,X-App-Locale,X-CSRF-Token,Cache-Control" always;
            add_header Access-Control-Max-Age           86400        always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering    off;
    }

    # ── SMTP test endpoints — longer timeout (backend times out in 20s) ──────
    location ~ ^/api/dashboard/settings/smtp/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials "true"       always;
            add_header Access-Control-Allow-Methods     "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Origin,Content-Type,Accept,Authorization,X-Requested-With,X-Frontend-Key,X-Country-Id,X-Country-Code,X-App-Locale,X-CSRF-Token,Cache-Control" always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering    off;
    }

    # ── File upload endpoints — larger body size ──────────────────────────────
    location ~ ^/api/dashboard/settings$ {
        client_max_body_size 10m;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }

    # ── Private/protected files — MUST stay unreachable from the web ────────────
    # Carried forward from the security fix already made in back/nginx.conf this session —
    # see that file's comment for the full reasoning (directory-separation alone isn't a
    # real access-control guarantee). Must come before the general /storage/ block below;
    # ^~ makes the precedence explicit regardless of declaration order.
    location ^~ /storage/private/ {
        deny all;
        return 404;
    }

    # ── Storage (public files) ────────────────────────────────────────────────
    location /storage/ {
        alias /var/www/vhosts/imanjo.com/httpdocs/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
}
