name: Verify 2E Backend

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test content quality packages
        run: go test ./internal/services/contentaudit ./internal/handlers/contentaudit ./internal/routes
