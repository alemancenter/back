# imanjo.com — Plesk Additional Nginx Directives (frontend)
# Astro Node standalone adapter, internal port 127.0.0.1:8080
#
# No equivalent of this file existed for the old frontend — it ran under PM2 as a plain
# Next.js app with its own separate nginx server block (see back/nginx.conf's retired
# "Frontend — alemancenter.com" section, and back/deploy-alemancenter.sh), not through
# Plesk's Additional Directives mechanism. Drafted fresh for the Astro/systemd setup this
# migration introduces — there's no prior imanjo/alemancenter version to diff against.

# Astro's hashed, immutable build assets — safe to cache aggressively.
location /_astro/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location / {
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering    off;
}
